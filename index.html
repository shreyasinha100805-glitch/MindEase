<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindEase - AI Mental Health Companion</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --teal: #0d9488;
            --teal-light: #14b8a6;
            --teal-bg: #f0fdfa;
            --blue: #2d9cdb;
            --dark: #0f172a;
            --gray: #64748b;
            --light: #f8fafc;
            --white: #ffffff;
            --red: #ef4444;
            --border: #e2e8f0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #e0f7f4 0%, #f0e6ff 50%, #e0f2fe 100%);
            min-height: 100vh;
            padding: 24px 16px;
        }

        .container { max-width: 640px; margin: 0 auto; }

        /* HEADER */
        .header {
            background: linear-gradient(135deg, #0d9488, #2d9cdb);
            color: white;
            padding: 32px 28px;
            border-radius: 24px;
            text-align: center;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px rgba(13,148,136,0.3);
            position: relative;
            overflow: hidden;
        }
        .header::before {
            content: '';
            position: absolute;
            top: -30px; right: -30px;
            width: 120px; height: 120px;
            background: rgba(255,255,255,0.08);
            border-radius: 50%;
        }
        .header::after {
            content: '';
            position: absolute;
            bottom: -20px; left: -20px;
            width: 80px; height: 80px;
            background: rgba(255,255,255,0.06);
            border-radius: 50%;
        }
        .header-emoji { font-size: 48px; margin-bottom: 8px; display: block; }
        .header h1 { font-size: 32px; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 6px; }
        .header p { opacity: 0.85; font-size: 15px; font-weight: 400; }
        .header-badge {
            display: inline-block;
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 20px;
            padding: 4px 14px;
            font-size: 12px;
            margin-top: 10px;
            font-weight: 500;
        }

        /* CARDS */
        .card {
            background: white;
            border-radius: 20px;
            padding: 22px;
            margin-bottom: 16px;
            box-shadow: 0 2px 16px rgba(0,0,0,0.06);
            border: 1px solid var(--border);
            transition: box-shadow 0.2s;
        }
        .card:hover { box-shadow: 0 4px 24px rgba(0,0,0,0.1); }
        .card-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--dark);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* MOOD BUTTONS */
        .mood-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
        }
        .mood-btn {
            border: 2px solid var(--border);
            background: var(--light);
            border-radius: 16px;
            padding: 12px 6px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            color: var(--gray);
            font-family: 'Inter', sans-serif;
        }
        .mood-btn .mood-emoji { font-size: 26px; }
        .mood-btn:hover { border-color: var(--teal); background: var(--teal-bg); color: var(--teal); transform: translateY(-2px); }
        .mood-btn.active { background: var(--teal); color: white; border-color: var(--teal); transform: translateY(-2px); box-shadow: 0 4px 16px rgba(13,148,136,0.3); }

        /* TEXTAREA */
        .journal-box {
            width: 100%;
            height: 110px;
            border: 2px solid var(--border);
            border-radius: 14px;
            padding: 14px;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            resize: none;
            outline: none;
            transition: border 0.2s;
            color: var(--dark);
            line-height: 1.6;
        }
        .journal-box:focus { border-color: var(--teal); box-shadow: 0 0 0 3px rgba(13,148,136,0.1); }
        .char-count { text-align: right; font-size: 11px; color: var(--gray); margin-top: 6px; }

        /* ANALYZE BUTTON */
        .analyze-btn {
            width: 100%;
            background: linear-gradient(135deg, #0d9488, #2d9cdb);
            color: white;
            border: none;
            border-radius: 16px;
            padding: 18px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 16px;
            transition: all 0.2s;
            font-family: 'Inter', sans-serif;
            letter-spacing: 0.3px;
            box-shadow: 0 4px 16px rgba(13,148,136,0.3);
        }
        .analyze-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(13,148,136,0.4); }
        .analyze-btn:active { transform: translateY(0); }
        .analyze-btn:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }

        /* LOADING */
        .loading {
            display: none;
            text-align: center;
            padding: 28px;
            background: white;
            border-radius: 20px;
            margin-bottom: 16px;
            border: 1px solid var(--border);
        }
        .spinner {
            width: 44px; height: 44px;
            border: 4px solid var(--border);
            border-top-color: var(--teal);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 14px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text { color: var(--gray); font-size: 14px; font-weight: 500; }
        .loading-model { color: var(--teal); font-size: 12px; margin-top: 6px; }

        /* RESULT */
        .result-card {
            display: none;
            background: white;
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 16px;
            box-shadow: 0 4px 24px rgba(13,148,136,0.12);
            border: 2px solid var(--teal-light);
            animation: slideIn 0.4s ease;
        }
        @keyframes slideIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
        .result-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
            padding-bottom: 14px;
            border-bottom: 1px solid var(--border);
        }
        .result-badge {
            background: var(--teal-bg);
            color: var(--teal);
            border-radius: 20px;
            padding: 4px 12px;
            font-size: 12px;
            font-weight: 600;
        }
        .result-title { font-size: 17px; font-weight: 700; color: var(--teal); }
        .ai-response {
            color: #334155;
            line-height: 1.8;
            font-size: 15px;
            margin-bottom: 20px;
        }
        .ai-response b { color: var(--teal); }

        /* EMERGENCY BUTTON */
        .emergency-btn {
            width: 100%;
            background: transparent;
            color: var(--red);
            border: 2px solid var(--red);
            border-radius: 14px;
            padding: 13px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Inter', sans-serif;
        }
        .emergency-btn:hover { background: var(--red); color: white; transform: translateY(-1px); }

        /* MOOD CHART */
        .mood-chart {
            display: flex;
            gap: 6px;
            align-items: flex-end;
            height: 60px;
            margin-top: 12px;
        }
        .chart-bar {
            flex: 1;
            border-radius: 6px 6px 0 0;
            background: var(--teal);
            opacity: 0.7;
            transition: all 0.3s;
            min-height: 4px;
        }
        .chart-bar:hover { opacity: 1; }

        /* HISTORY */
        .history-list { display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }
        .history-item {
            background: var(--light);
            border-radius: 12px;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid var(--border);
            transition: all 0.2s;
        }
        .history-item:hover { background: var(--teal-bg); border-color: var(--teal); }
        .history-mood { font-weight: 600; color: var(--dark); font-size: 14px; }
        .history-date { color: var(--gray); font-size: 12px; }
        .history-empty { color: var(--gray); font-size: 13px; text-align: center; padding: 16px 0; }

        /* CLEAR BTN */
        .clear-btn {
            background: none;
            border: none;
            color: var(--gray);
            font-size: 12px;
            cursor: pointer;
            float: right;
            font-family: 'Inter', sans-serif;
            text-decoration: underline;
        }
        .clear-btn:hover { color: var(--red); }

        /* FOOTER */
        .footer {
            text-align: center;
            color: var(--gray);
            font-size: 12px;
            margin-top: 8px;
            padding: 12px;
        }

        /* DARK MODE TOGGLE */
        .dark-toggle {
            position: fixed;
            top: 16px; right: 16px;
            background: white;
            border: 1px solid var(--border);
            border-radius: 50%;
            width: 42px; height: 42px;
            font-size: 20px;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s;
            z-index: 100;
        }
        .dark-toggle:hover { transform: scale(1.1); }

        /* DARK MODE */
        body.dark { background: #0f172a; }
        body.dark .card, body.dark .result-card, body.dark .loading { background: #1e293b; border-color: #334155; }
        body.dark .card-title, body.dark .history-mood { color: #f1f5f9; }
        body.dark .journal-box { background: #1e293b; color: #f1f5f9; border-color: #334155; }
        body.dark .mood-btn { background: #1e293b; border-color: #334155; color: #94a3b8; }
        body.dark .mood-btn:hover { background: #0d2b2a; }
        body.dark .history-item { background: #1e293b; border-color: #334155; }
        body.dark .dark-toggle { background: #1e293b; border-color: #334155; }
        body.dark .ai-response { color: #cbd5e1; }

        @media (max-width: 480px) {
            .mood-grid { grid-template-columns: repeat(3, 1fr); }
            .header h1 { font-size: 26px; }
        }
    </style>
</head>
<body>

<button class="dark-toggle" onclick="toggleDark()" title="Toggle dark mode">🌙</button>

<div class="container">

    <!-- HEADER -->
    <div class="header">
        <span class="header-emoji">🧠</span>
        <h1>MindEase</h1>
        <p>Your AI Mental Health Companion</p>
        <span class="header-badge">✨ Powered by AI • Always Free</span>
    </div>

    <!-- MOOD SELECTOR -->
    <div class="card">
        <div class="card-title">💭 How are you feeling today?</div>
        <div class="mood-grid">
            <button class="mood-btn" onclick="selectMood(this, 'Happy')">
                <span class="mood-emoji">😊</span>Happy
            </button>
            <button class="mood-btn" onclick="selectMood(this, 'Anxious')">
                <span class="mood-emoji">😟</span>Anxious
            </button>
            <button class="mood-btn" onclick="selectMood(this, 'Sad')">
                <span class="mood-emoji">😔</span>Sad
            </button>
            <button class="mood-btn" onclick="selectMood(this, 'Stressed')">
                <span class="mood-emoji">😤</span>Stressed
            </button>
            <button class="mood-btn" onclick="selectMood(this, 'Numb')">
                <span class="mood-emoji">😐</span>Numb
            </button>
        </div>
    </div>

    <!-- JOURNAL -->
    <div class="card">
        <div class="card-title">✍️ Tell me more...</div>
        <textarea class="journal-box" id="journal"
            placeholder="Write freely about what's on your mind. This is a safe space 💙"
            oninput="updateCharCount(this)"></textarea>
        <div class="char-count"><span id="char-count">0</span> / 300</div>
    </div>

    <!-- ANALYZE BUTTON -->
    <button class="analyze-btn" onclick="analyzeMood()" id="analyze-btn">
        🔍 Analyze My Mood
    </button>

    <!-- LOADING -->
    <div class="loading" id="loading">
        <div class="spinner"></div>
        <div class="loading-text">AI is understanding your feelings...</div>
        <div class="loading-model" id="loading-model">Connecting to AI...</div>
    </div>

    <!-- RESULT -->
    <div class="result-card" id="result">
        <div class="result-header">
            <span class="result-title">💡 AI Analysis</span>
            <span class="result-badge" id="mood-badge">Analyzing...</span>
        </div>
        <div class="ai-response" id="ai-response"></div>
        <button class="emergency-btn" onclick="emergency()">
            🚨 Talk to a Real Person
        </button>
    </div>

    <!-- MOOD HISTORY -->
    <div class="card">
        <div class="card-title">
            📊 Your Mood History
            <button class="clear-btn" onclick="clearHistory()">Clear all</button>
        </div>
        <div class="history-list" id="history-list"></div>
    </div>

    <div class="footer">
        Made with 💙 for LUMA Hackathon 2026 • MindEase
    </div>

</div>

<script src="app.js"></script>
</body>
</html>
